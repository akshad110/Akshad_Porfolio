name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: ci-placeholder-secret-not-for-production
          MONGODB_URI: mongodb://localhost:27017/akshad-portfolio
